name: csc418_pipeline

services:
  db2:
    image: mysql:5.7
    container_name: pipeline_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: notesdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - db_data_pipeline:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  web2:
    image: python:3.12-slim
    container_name: pipeline_web
    working_dir: /app
    environment:
      DB_HOST: db2
    volumes:
      - ./:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    depends_on:
      db2:
        condition: service_healthy
    ports:
      - "8082:5000"

volumes:
  db_data_pipeline:
